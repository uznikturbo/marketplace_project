{% comment %}
Спільна навігація профілю користувача.

Параметр active — "profile" | "orders" | "wishlist".
{% endcomment %}
<ul class="profile-nav">
    <li>
        <a href="{% if active == "profile" %}#{% else %}{% url 'profile' %}{% endif %}"{% if active == "profile" %} class="active"{% endif %}>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Особисті дані
        </a>
    </li>
    <li>
        <a href="{% url 'profile_orders' %}"{% if active == "orders" %} class="active"{% endif %}>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            Мої замовлення
        </a>
    </li>
    <li>
        <a href="{% url 'profile_wishlist' %}"{% if active == "wishlist" %} class="active"{% endif %}>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            Список бажань
        </a>
    </li>
    {% if user.is_vendor %}
    <li>
        <a href="{% url 'vendor_view' %}">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM12 8v8m-4-4h8"/></svg>
            Кабінет продавця
        </a>
    </li>
    {% endif %}
    <li style="border-top: 1px solid var(--gray-4); margin-top: 8px; padding-top: 8px;">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Вийти з акаунта
            </button>
        </form>
    </li>
</ul>
