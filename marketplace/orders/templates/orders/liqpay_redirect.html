<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправлення на оплату...</title>
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #1a1a1a;
        }
        .loader {
            border: 4px solid #e8e8e8;
            border-top: 4px solid #00a046; /* Твій фірмовий зелений */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Зачекайте...</h2>
    <p>Перенаправляємо на безпечну сторінку оплати LiqPay</p>

    <form id="liqpay-auto-form" method="POST" action="https://www.liqpay.ua/api/3/checkout" accept-charset="utf-8" style="display: none;">
        <input type="hidden" name="data" value="{{ data }}" />
        <input type="hidden" name="signature" value="{{ signature }}" />
    </form>

    <script>
        // Щойно сторінка завантажиться, відразу відправляємо форму
        window.onload = function() {
            document.getElementById('liqpay-auto-form').submit();
        };
    </script>
</body>
</html>
